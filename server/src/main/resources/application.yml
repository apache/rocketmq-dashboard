server:
  port: 8888

spring:
  application:
    name: rocketmq-studio
  profiles:
    active: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rocketmq?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:studio123}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      table-prefix: rmq_
      id-type: auto

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

studio:
  auth:
    login-required: ${STUDIO_AUTH_LOGIN_REQUIRED:false}
    users:
      - username: ${STUDIO_AUTH_ADMIN_USERNAME:}
        password: ${STUDIO_AUTH_ADMIN_PASSWORD:}
        admin: true
  cluster:
    seed-demo-data: ${STUDIO_CLUSTER_SEED_DEMO_DATA:false}
  metrics:
    prometheus:
      base-url: ${STUDIO_METRICS_PROMETHEUS_BASE_URL:}
      connect-timeout: ${STUDIO_METRICS_PROMETHEUS_CONNECT_TIMEOUT:3s}
      read-timeout: ${STUDIO_METRICS_PROMETHEUS_READ_TIMEOUT:10s}
      username: ${STUDIO_METRICS_PROMETHEUS_USERNAME:}
      password: ${STUDIO_METRICS_PROMETHEUS_PASSWORD:}
      bearer-token: ${STUDIO_METRICS_PROMETHEUS_BEARER_TOKEN:}
  rocketmq:
    namesrv-addr: ${STUDIO_ROCKETMQ_NAMESRV_ADDR:}
    # ACL 2.0 credentials for broker-admin connections (AUTH-01). Set both to manage
    # ACL-enabled clusters; leave empty for open clusters.
    acl:
      access-key: ${STUDIO_ROCKETMQ_ACL_ACCESS_KEY:}
      secret-key: ${STUDIO_ROCKETMQ_ACL_SECRET_KEY:}
  # ProxyAdminService credentials (ACL 2.0). Least privilege: a read-only admin
  # account (e.g. grants Get,List on cluster:proxy.admin.client) is sufficient.
  proxyadmin:
    username: ${STUDIO_PROXYADMIN_USERNAME:}
    password: ${STUDIO_PROXYADMIN_PASSWORD:}
  query-history:
    retention-days: ${STUDIO_QUERY_HISTORY_RETENTION_DAYS:90}
    cleanup-interval: ${STUDIO_QUERY_HISTORY_CLEANUP_INTERVAL:PT24H}
  llm:
    token: ${RMQ_LLM_TOKEN:}
    anthropic-base-url: ${RMQ_ANTHROPIC_BASE_URL:}
