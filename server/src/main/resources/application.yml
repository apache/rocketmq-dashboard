server:
  port: 8888

spring:
  application:
    name: rocketmq-studio
  http:
    converters:
      preferred-json-mapper: jackson2
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rocketmq?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:studio123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      leak-detection-threshold: 30000
  mail:
    host: ${STUDIO_ALERTING_SMTP_HOST:}
    port: ${STUDIO_ALERTING_SMTP_PORT:587}
    username: ${STUDIO_ALERTING_SMTP_USERNAME:}
    password: ${STUDIO_ALERTING_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  ai:
    mcp:
      server:
        enabled: true
        protocol: STREAMABLE
        name: rocketmq-studio
        version: '@project.version@'
        type: SYNC
        instructions: >-
          RocketMQ Studio exposes RocketMQ operational tools through MCP.
          Call rmq.instance.capabilities for the selected Instance before choosing tools.
          Only call a tool when the returned capabilities include all capabilities
          required by its description. Recheck capabilities when switching Instances.
        streamable-http:
          mcp-endpoint: /api/mcp
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      table-prefix: rmq_
      id-type: auto

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false

studio:
  cors:
    allowed-origins: ${STUDIO_CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}
  auth:
    login-required: ${STUDIO_AUTH_LOGIN_REQUIRED:true}
    session-cookie-name: rmq_studio_session
    session-cookie-secure: ${STUDIO_AUTH_SESSION_COOKIE_SECURE:true}
    session-cookie-same-site: Strict
    users:
      - username: ${STUDIO_AUTH_ADMIN_USERNAME:admin}
        password: ${STUDIO_AUTH_ADMIN_PASSWORD:admin}
        admin: true
  cluster:
    seed-demo-data: false
    admin:
      credentials:
        rmq-test:
          access-key: rocketmq2
          secret-key: 12345678
  metrics:
    prometheus:
      base-url: ${STUDIO_METRICS_PROMETHEUS_BASE_URL:}
      connect-timeout: 3s
      read-timeout: 10s
      username: ${STUDIO_METRICS_PROMETHEUS_USERNAME:}
      password: ${STUDIO_METRICS_PROMETHEUS_PASSWORD:}
      bearer-token: ${STUDIO_METRICS_PROMETHEUS_BEARER_TOKEN:}
  rocketmq:
    namesrv-addr: ${STUDIO_ROCKETMQ_NAMESRV_ADDR:localhost:9876}
  query-history:
    retention-days: 90
    cleanup-interval: PT24H
  ai:
    allow-l3-tools: ${STUDIO_AI_ALLOW_L3_TOOLS:false}
    token-secret: ${STUDIO_AI_TOKEN_SECRET:}
    conversation:
      retention-days: 90
      cleanup-batch-size: 500
      cleanup-max-batches: 20
      cleanup-interval: PT24H
      orphan-run-timeout: PT10M
      stop-grace: PT3S
      workspace-dir: ${STUDIO_AI_CONVERSATION_WORKSPACE_DIR:/tmp/rocketmq-studio-ai}
      rmqctl-enabled: ${STUDIO_AI_RMQCTL_ENABLED:true}
      rmqctl-server-url: ${STUDIO_AI_RMQCTL_SERVER_URL:}
      rmqctl-timeout: PT60S
  alerting:
    collection-interval: PT30S
    collection-parallelism: 4
    collection-timeout: PT15S
    collection-lease-duration: PT1M
    collection-lease-renewal-interval: PT15S
    snapshot-retention: PT24H
    snapshot-cleanup-interval: PT1H
    notification-dispatch-interval: PT10S
    notification-retention: P30D
    notification-cleanup-interval: PT1H
    notification-cleanup-batch-size: 500
    notification-cleanup-max-batches: 10
    notification-claim-timeout: PT1M
    notification-claim-renewal-interval: PT20S
    notification-heartbeat-threads: 2
  llm:
    token: ${RMQ_LLM_TOKEN:}
    anthropic-base-url: ${RMQ_ANTHROPIC_BASE_URL:}
    cli-allowed-environment: ${RMQ_LLM_CLI_ALLOWED_ENVIRONMENT:}
