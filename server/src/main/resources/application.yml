server:
  port: 8888

spring:
  application:
    name: rocketmq-studio
  profiles:
    active: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rocketmq?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:studio123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: ${STUDIO_ALERTING_SMTP_HOST:}
    port: ${STUDIO_ALERTING_SMTP_PORT:587}
    username: ${STUDIO_ALERTING_SMTP_USERNAME:}
    password: ${STUDIO_ALERTING_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${STUDIO_ALERTING_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${STUDIO_ALERTING_SMTP_STARTTLS:true}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      table-prefix: rmq_
      id-type: auto

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    mail:
      # SMTP is optional for native alerting; skip the SMTP connectivity probe
      # unless explicitly enabled, so health stays UP when no SMTP host is configured.
      enabled: ${STUDIO_ALERTING_SMTP_HEALTH_ENABLED:false}

studio:
  cors:
    allowed-origins: ${STUDIO_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    login-required: ${STUDIO_AUTH_LOGIN_REQUIRED:true}
    # Production defaults. The dev profile disables Secure so local HTTP works without extra environment variables.
    session-cookie-name: ${STUDIO_AUTH_SESSION_COOKIE_NAME:rmq_studio_session}
    session-cookie-secure: ${STUDIO_AUTH_SESSION_COOKIE_SECURE:true}
    session-cookie-same-site: ${STUDIO_AUTH_SESSION_COOKIE_SAME_SITE:Strict}
    users:
      - username: ${STUDIO_AUTH_ADMIN_USERNAME:}
        password: ${STUDIO_AUTH_ADMIN_PASSWORD:}
        admin: true
  cluster:
    seed-demo-data: ${STUDIO_CLUSTER_SEED_DEMO_DATA:false}
  metrics:
    prometheus:
      base-url: ${STUDIO_METRICS_PROMETHEUS_BASE_URL:}
      connect-timeout: ${STUDIO_METRICS_PROMETHEUS_CONNECT_TIMEOUT:3s}
      read-timeout: ${STUDIO_METRICS_PROMETHEUS_READ_TIMEOUT:10s}
      username: ${STUDIO_METRICS_PROMETHEUS_USERNAME:}
      password: ${STUDIO_METRICS_PROMETHEUS_PASSWORD:}
      bearer-token: ${STUDIO_METRICS_PROMETHEUS_BEARER_TOKEN:}
  rocketmq:
    namesrv-addr: ${STUDIO_ROCKETMQ_NAMESRV_ADDR:}
  query-history:
    retention-days: ${STUDIO_QUERY_HISTORY_RETENTION_DAYS:90}
    cleanup-interval: ${STUDIO_QUERY_HISTORY_CLEANUP_INTERVAL:PT24H}
  alerting:
    collection-interval: ${STUDIO_ALERTING_COLLECTION_INTERVAL:PT30S}
    collection-parallelism: ${STUDIO_ALERTING_COLLECTION_PARALLELISM:4}
    collection-timeout: ${STUDIO_ALERTING_COLLECTION_TIMEOUT:PT15S}
    snapshot-retention: ${STUDIO_ALERTING_SNAPSHOT_RETENTION:PT24H}
    snapshot-cleanup-interval: ${STUDIO_ALERTING_SNAPSHOT_CLEANUP_INTERVAL:PT1H}
    notification-dispatch-interval: ${STUDIO_ALERTING_NOTIFICATION_DISPATCH_INTERVAL:PT10S}
    notification-retention: ${STUDIO_ALERTING_NOTIFICATION_RETENTION:P30D}
    notification-cleanup-interval: ${STUDIO_ALERTING_NOTIFICATION_CLEANUP_INTERVAL:PT1H}
    notification-cleanup-batch-size: ${STUDIO_ALERTING_NOTIFICATION_CLEANUP_BATCH_SIZE:500}
    notification-cleanup-max-batches: ${STUDIO_ALERTING_NOTIFICATION_CLEANUP_MAX_BATCHES:10}
    notification-claim-timeout: ${STUDIO_ALERTING_NOTIFICATION_CLAIM_TIMEOUT:PT1M}
    notification-claim-renewal-interval: ${STUDIO_ALERTING_NOTIFICATION_CLAIM_RENEWAL_INTERVAL:PT20S}
    notification-heartbeat-threads: ${STUDIO_ALERTING_NOTIFICATION_HEARTBEAT_THREADS:2}
  llm:
    token: ${RMQ_LLM_TOKEN:}
    anthropic-base-url: ${RMQ_ANTHROPIC_BASE_URL:}
    cli-allowed-environment: ${RMQ_LLM_CLI_ALLOWED_ENVIRONMENT:}
