server:
  port: 8888

spring:
  application:
    name: rocketmq-studio
  profiles:
    active: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rocketmq_studio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:studio123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    mcp:
      server:
        enabled: true
        protocol: SSE
        name: rocketmq-studio
        version: 1.0.0
        type: SYNC
        instructions: RocketMQ Studio exposes RocketMQ operational tools through MCP.
        base-url: ""
        sse-endpoint: /api/ai/mcp/sse
        sse-message-endpoint: /api/ai/mcp/messages
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      table-prefix: rmq_
      id-type: auto

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

studio:
  auth:
    login-required: ${STUDIO_AUTH_LOGIN_REQUIRED:false}
    users:
      - username: ${STUDIO_AUTH_ADMIN_USERNAME:}
        password: ${STUDIO_AUTH_ADMIN_PASSWORD:}
        admin: true
  cluster:
    seed-demo-data: ${STUDIO_CLUSTER_SEED_DEMO_DATA:false}
  metrics:
    prometheus:
      base-url: ${STUDIO_METRICS_PROMETHEUS_BASE_URL:}
      connect-timeout: ${STUDIO_METRICS_PROMETHEUS_CONNECT_TIMEOUT:3s}
      read-timeout: ${STUDIO_METRICS_PROMETHEUS_READ_TIMEOUT:10s}
      username: ${STUDIO_METRICS_PROMETHEUS_USERNAME:}
      password: ${STUDIO_METRICS_PROMETHEUS_PASSWORD:}
      bearer-token: ${STUDIO_METRICS_PROMETHEUS_BEARER_TOKEN:}
  rocketmq:
    namesrv-addr: ${STUDIO_ROCKETMQ_NAMESRV_ADDR:}
  query-history:
    retention-days: ${STUDIO_QUERY_HISTORY_RETENTION_DAYS:90}
    cleanup-interval: ${STUDIO_QUERY_HISTORY_CLEANUP_INTERVAL:PT24H}
  llm:
    token: ${RMQ_LLM_TOKEN:}
    anthropic-base-url: ${RMQ_ANTHROPIC_BASE_URL:}
