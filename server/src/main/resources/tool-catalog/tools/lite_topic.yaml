version: 2.0.0
tools:
  - name: rmq.lite_topic.list
    cli:
      resource: lite-topic
      verb: list
    description: List RocketMQ 5.x LiteTopics by prefix or pattern.
    riskLevel: L1
    permission: topic:read
    requiredCapabilities:
      - LITE_TOPIC
    inputSchema:
      type: object
      required:
        - cluster
      additionalProperties: false
      properties:
        cluster:
          type: string
          minLength: 1
        pattern:
          type: string
    outputSchema:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - name
              - namespace
              - clusterId
              - type
              - writeQueues
              - readQueues
              - perm
              - messageCount
              - tps
              - consumerGroupCount
            additionalProperties: false
            properties:
              name:
                type: string
              namespace:
                type: string
              clusterId:
                type: string
              type:
                enum:
                  - LITE
              writeQueues:
                type: integer
              readQueues:
                type: integer
              perm:
                enum:
                  - RW
                  - RO
                  - WO
              messageCount:
                type: integer
              tps:
                type: number
              consumerGroupCount:
                type: integer
    viewHint: table
    deprecated: false
  - name: rmq.lite_topic.create
    cli:
      resource: lite-topic
      verb: create
    description: Create a RocketMQ 5.x LiteTopic through the standard AdminClient path.
    riskLevel: L2
    permission: topic:write
    requiredCapabilities:
      - LITE_TOPIC
    inputSchema:
      type: object
      required:
        - cluster
        - topic
      additionalProperties: false
      properties:
        cluster:
          type: string
          minLength: 1
        topic:
          type: string
          minLength: 1
        namespace:
          type: string
        writeQueues:
          type: integer
          minimum: 1
        readQueues:
          type: integer
          minimum: 1
        remark:
          type: string
        dry_run:
          type: boolean
          description: When true, preview the mutation without executing it; omit to apply with a confirm_token.
        confirm_token:
          type: string
          minLength: 1
    outputSchema:
      type: object
      required:
        - status
        - cluster
        - plan
      additionalProperties: false
      properties:
        status:
          enum:
            - PLANNED
            - EXECUTED
        cluster:
          type: string
        confirm_token:
          type: string
        plan:
          type: object
          required:
            - summary
            - impact
            - before
            - after
            - warnings
          additionalProperties: false
          properties:
            summary:
              type: string
            impact:
              type: array
              items:
                type: string
            before:
              type: object
            after:
              type: object
            warnings:
              type: array
              items:
                type: string
        result:
          type: object
          required:
            - name
            - namespace
            - cluster
            - type
            - writeQueues
            - readQueues
            - perm
          additionalProperties: false
          properties:
            name:
              type: string
            namespace:
              type: string
            cluster:
              type: string
            type:
              type: string
            writeQueues:
              type: integer
            readQueues:
              type: integer
            perm:
              type: string
            remark:
              type: string
    viewHint: object
    deprecated: false
