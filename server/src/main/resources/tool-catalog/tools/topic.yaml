version: 2.0.0
tools:
  - name: rmq.topic.list
    cli:
      resource: topic
      verb: list
    description: List RocketMQ topics in one Studio Instance.
    riskLevel: L1
    permission: topic:read
    requiredCapabilities:
      - TOPIC_MANAGEMENT
    inputSchema:
      type: object
      required:
        - instanceId
      additionalProperties: false
      properties:
        instanceId:
          type: string
          description: Studio Instance identifier.
          minLength: 1
        topicName:
          type: string
          description: Fuzzy topic name filter.
          minLength: 1
        type:
          enum:
            - NORMAL
            - FIFO
            - DELAY
            - TRANSACTION
            - LITE
    outputSchema:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - name
              - writeQueues
              - readQueues
              - messageCount
              - tps
              - consumerGroupCount
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 1
              clusterId:
                type: string
              type:
                enum:
                  - NORMAL
                  - FIFO
                  - DELAY
                  - TRANSACTION
                  - LITE
              writeQueues:
                type: integer
              readQueues:
                type: integer
              perm:
                enum:
                  - RW
                  - RO
                  - WO
              messageCount:
                type: integer
              tps:
                type: number
              consumerGroupCount:
                type: integer
    viewHint: table
    deprecated: false
  - name: rmq.topic.detail
    cli:
      resource: topic
      verb: detail
    description: "Show full detail of one RocketMQ topic: configuration, consumer groups, broker routes and per-queue offset stats. queueStats is omitted (without failing the call) when the Instance lacks REMOTING capability or offset stats collection fails."
    riskLevel: L1
    permission: topic:read
    requiredCapabilities:
      - TOPIC_MANAGEMENT
    inputSchema:
      type: object
      required:
        - instanceId
        - topicName
      additionalProperties: false
      properties:
        instanceId:
          type: string
          description: Studio Instance identifier.
          minLength: 1
        topicName:
          type: string
          minLength: 1
    outputSchema:
      type: object
      required:
        - instanceId
        - name
        - writeQueues
        - readQueues
        - messageCount
        - tps
        - consumerGroupCount
        - consumerGroups
        - routes
      additionalProperties: false
      properties:
        instanceId:
          type: string
        name:
          type: string
          minLength: 1
        clusterId:
          type: string
        type:
          enum:
            - NORMAL
            - FIFO
            - DELAY
            - TRANSACTION
            - LITE
        writeQueues:
          type: integer
        readQueues:
          type: integer
        perm:
          enum:
            - RW
            - RO
            - WO
        messageCount:
          type: integer
        tps:
          type: number
        consumerGroupCount:
          type: integer
        remark:
          type: string
        consumerGroups:
          type: array
          items:
            type: object
            required:
              - group
              - diffTotal
              - metricsAvailable
            additionalProperties: false
            properties:
              group:
                type: string
              consumeType:
                type: string
              messageModel:
                type: string
              consumeTps:
                type: number
              diffTotal:
                type: integer
              metricsAvailable:
                type: boolean
        routes:
          type: array
          items:
            type: object
            required:
              - brokerName
              - writeQueues
              - readQueues
              - readable
              - writable
            additionalProperties: false
            properties:
              brokerName:
                type: string
              brokerAddr:
                type: string
              masterAddr:
                type: string
              brokerAddrs:
                type: object
                additionalProperties:
                  type: string
              brokerIds:
                type: array
                items:
                  type: integer
              replicaCount:
                type: integer
              writeQueues:
                type: integer
              readQueues:
                type: integer
              perm:
                type: string
              permCode:
                type: integer
              readable:
                type: boolean
              writable:
                type: boolean
              topicSysFlag:
                type: integer
        queueStats:
          type: array
          description: Per-queue offset stats; omitted when the Instance lacks REMOTING capability or stats collection fails.
          items:
            type: object
            required:
              - brokerName
              - queueId
              - minOffset
              - maxOffset
            additionalProperties: false
            properties:
              brokerName:
                type: string
              queueId:
                type: integer
              minOffset:
                type: integer
              maxOffset:
                type: integer
              lastUpdateTimestamp:
                type: integer
    viewHint: object
    deprecated: false
  - name: rmq.topic.route
    cli:
      resource: topic
      verb: route
    description: Return the broker route info for one RocketMQ topic.
    riskLevel: L1
    permission: topic:read
    requiredCapabilities:
      - TOPIC_MANAGEMENT
      - REMOTING
    inputSchema:
      type: object
      required:
        - instanceId
        - topicName
      additionalProperties: false
      properties:
        instanceId:
          type: string
          description: Studio Instance identifier.
          minLength: 1
        topicName:
          type: string
          minLength: 1
    outputSchema:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - brokerName
              - writeQueues
              - readQueues
              - readable
              - writable
            additionalProperties: false
            properties:
              brokerName:
                type: string
              brokerAddr:
                type: string
              masterAddr:
                type: string
              brokerAddrs:
                type: object
                additionalProperties:
                  type: string
              brokerIds:
                type: array
                items:
                  type: integer
              replicaCount:
                type: integer
              writeQueues:
                type: integer
              readQueues:
                type: integer
              perm:
                type: string
              permCode:
                type: integer
              readable:
                type: boolean
              writable:
                type: boolean
              topicSysFlag:
                type: integer
    viewHint: table
    deprecated: false
  - name: rmq.topic.update
    cli:
      resource: topic
      verb: update
    description: Update a RocketMQ topic.
    riskLevel: L2
    permission: topic:write
    requiredCapabilities:
      - TOPIC_MANAGEMENT
    inputSchema:
      type: object
      required:
        - instanceId
        - topicName
      additionalProperties: false
      properties:
        instanceId:
          type: string
          description: Studio Instance identifier.
          minLength: 1
        topicName:
          type: string
          minLength: 1
        type:
          description: "Only used when the topic does not exist (creation); the topic type cannot be changed after creation."
          enum:
            - NORMAL
            - FIFO
            - DELAY
            - TRANSACTION
            - LITE
        writeQueues:
          type: integer
          minimum: 1
        readQueues:
          type: integer
          minimum: 1
        perm:
          enum:
            - RW
            - RO
            - WO
        remark:
          type: string
        dry_run:
          type: boolean
          description: When true, preview the mutation without executing it; omit to apply with a confirm_token.
        confirm_token:
          type: string
          minLength: 1
    outputSchema:
      type: object
      required:
        - status
        - instanceId
        - plan
      additionalProperties: false
      properties:
        status:
          enum:
            - PLANNED
            - EXECUTED
        instanceId:
          type: string
        confirm_token:
          type: string
        plan:
          type: object
          required:
            - summary
            - impact
            - before
            - after
            - warnings
          additionalProperties: false
          properties:
            summary:
              type: string
            impact:
              type: array
              items:
                type: string
            before:
              type: object
            after:
              type: object
            warnings:
              type: array
              items:
                type: string
        result:
          type: object
    viewHint: object
    deprecated: false
  - name: rmq.topic.delete
    cli:
      resource: topic
      verb: delete
    description: Delete a RocketMQ topic.
    riskLevel: L3
    permission: topic:delete
    requiredCapabilities:
      - TOPIC_MANAGEMENT
    inputSchema:
      type: object
      required:
        - instanceId
        - topicName
      additionalProperties: false
      properties:
        instanceId:
          type: string
          description: Studio Instance identifier.
          minLength: 1
        topicName:
          type: string
          minLength: 1
        dry_run:
          type: boolean
          description: When true, preview the mutation without executing it; omit to apply with a confirm_token.
        confirm_token:
          type: string
          minLength: 1
        break_glass:
          type: boolean
        reason:
          type: string
          minLength: 1
    outputSchema:
      type: object
      required:
        - status
        - instanceId
        - plan
      additionalProperties: false
      properties:
        status:
          enum:
            - PLANNED
            - EXECUTED
        instanceId:
          type: string
        confirm_token:
          type: string
        plan:
          type: object
          required:
            - summary
            - impact
            - before
            - after
            - warnings
          additionalProperties: false
          properties:
            summary:
              type: string
            impact:
              type: array
              items:
                type: string
            before:
              type: object
            after:
              type: object
            warnings:
              type: array
              items:
                type: string
        result:
          type: object
    viewHint: object
    deprecated: false
