version: 2.0.0
tools:
  - name: rmq.dashboard.summary
    cli:
      resource: dashboard
      verb: summary
    description: "Summarize the whole Studio deployment (platform-level, aggregated across Instances), including all physical Broker cluster overviews."
    riskLevel: L1
    permission: dashboard:read
    requiredCapabilities: [CLUSTER_TOPOLOGY]
    inputSchema:
      type: object
      required: []
      additionalProperties: false
      properties: {}
    outputSchema:
      type: object
      required:
        - clusters
        - stats
      additionalProperties: false
      properties:
        clusters:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - type
              - status
              - brokers
              - proxies
              - topics
              - groups
              - tpsIn
              - tpsOut
              - version
              - throughput
            additionalProperties: false
            properties:
              id:
                type: string
              name:
                type: string
              type:
                type:
                  - string
                  - 'null'
              status:
                type:
                  - string
                  - 'null'
              brokers:
                type: integer
              proxies:
                type:
                  - integer
                  - 'null'
              topics:
                type: integer
              groups:
                type: integer
              tpsIn:
                type: integer
              tpsOut:
                type: integer
              version:
                type:
                  - string
                  - 'null'
              throughput:
                type: array
                items:
                  type: integer
        stats:
          type: object
          required:
            - totalClusters
            - healthyClusters
            - totalBrokers
            - totalProxies
            - totalNameServers
            - totalTopics
            - totalConsumerGroups
            - totalMessagesToday
            - messagesPerSecond
            - tpsIn
            - tpsOut
          additionalProperties: false
          properties:
            totalClusters:
              type: integer
            healthyClusters:
              type: integer
            totalBrokers:
              type: integer
            totalProxies:
              type:
                - integer
                - 'null'
            totalNameServers:
              type:
                - integer
                - 'null'
            totalTopics:
              type: integer
            totalConsumerGroups:
              type: integer
            totalMessagesToday:
              type: integer
            messagesPerSecond:
              type: integer
            tpsIn:
              type: integer
            tpsOut:
              type: integer
    viewHint: object
    deprecated: false
