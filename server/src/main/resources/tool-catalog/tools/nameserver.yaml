version: 2.0.0
tools:
  - name: rmq.nameserver.list
    cli:
      resource: nameserver
      verb: list
    description: "List the management NameServer endpoints, optionally filtered by physical cluster name."
    riskLevel: L1
    permission: nameserver:read
    requiredCapabilities:
      - NAMESERVER_ADMIN
    inputSchema:
      type: object
      required: []
      additionalProperties: false
      properties:
        clusterName:
          type: string
          description: Physical RocketMQ cluster name.
          minLength: 1
    outputSchema:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - namesrvAddr
              - k8sNamespace
              - k8sId
              - status
              - description
            additionalProperties: false
            properties:
              id:
                type: string
              name:
                type: string
              namesrvAddr:
                type: string
              k8sNamespace:
                type:
                  - string
                  - 'null'
              k8sId:
                type:
                  - string
                  - 'null'
              status:
                type: string
              description:
                type:
                  - string
                  - 'null'
    viewHint: table
    deprecated: false
  - name: rmq.nameserver.config
    cli:
      resource: nameserver
      verb: config
    description: "Read the configuration of each management NameServer endpoint for one physical cluster (read-only; no diff comparison and no mutation)."
    riskLevel: L1
    permission: nameserver:read
    requiredCapabilities:
      - NAMESERVER_ADMIN
    inputSchema:
      type: object
      required:
        - clusterName
      additionalProperties: false
      properties:
        clusterName:
          type: string
          description: Physical RocketMQ cluster name.
          minLength: 1
    outputSchema:
      type: object
      required:
        - items
        - resultMayBeTruncated
        - unreachableEndpoints
      additionalProperties: false
      properties:
        items:
          type: array
          description: Configuration of the NameServer endpoints that answered.
          items:
            type: object
            required:
              - addr
            additionalProperties: false
            properties:
              addr:
                type: string
              config:
                type: object
                additionalProperties:
                  type:
                    - string
                    - 'null'
        resultMayBeTruncated:
          type: boolean
          description: >-
            True when some NameServer endpoints of the cluster could not be read, so items cover
            only the reachable endpoints. Weigh the partial coverage before drawing cluster-wide
            conclusions, and retry or narrow the scope if needed.
        unreachableEndpoints:
          type: array
          description: Addresses of the NameServer endpoints that could not be read.
          items:
            type: string
    viewHint: object
    deprecated: false
