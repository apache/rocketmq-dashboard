version: 2.0.0
tools:
  - name: rmq.instance.capabilities
    cli:
      resource: instance
      verb: capabilities
    description: Return the managed Studio Instance's capabilities to determine which tool requirements it satisfies.
    riskLevel: L1
    permission: cluster:read
    requiredCapabilities: []
    inputSchema:
      type: object
      required:
        - instanceId
      additionalProperties: false
      properties:
        instanceId:
          type: string
          description: Studio Instance identifier.
          minLength: 1
    outputSchema:
      type: object
      required:
        - instanceId
        - capabilities
      additionalProperties: false
      properties:
        instanceId:
          type: string
          description: The bound Studio Instance identifier.
        capabilities:
          type: array
          description: Sorted unique capability labels; a tool requires all of its declared capabilities.
          uniqueItems: true
          items:
            type: string
    viewHint: object
    deprecated: false
  - name: rmq.instance.metrics
    cli:
      resource: instance
      verb: metrics
    description: "Query the dedicated metrics data source explicitly bound only to the selected Instance using raw PromQL or a profile/semantic metric selection. Shared or unbound sources are unsupported."
    riskLevel: L1
    permission: metrics:read
    requiredCapabilities: []
    inputSchema:
      type: object
      required:
        - instanceId
        - start
        - end
        - step
      oneOf:
        - required:
            - metric
          not:
            anyOf:
              - required:
                  - profileId
              - required:
                  - semanticMetric
        - required:
            - profileId
            - semanticMetric
          not:
            required:
              - metric
      additionalProperties: false
      properties:
        instanceId:
          type: string
          description: Studio Instance identifier.
          minLength: 1
        metric:
          type: string
          minLength: 1
        profileId:
          type: string
          minLength: 1
        semanticMetric:
          type: string
          minLength: 1
        start:
          type: integer
          description: Unix timestamp in seconds (PromQL query_range start).
        end:
          type: integer
          description: Unix timestamp in seconds (PromQL query_range end).
        step:
          type: string
          description: PromQL step duration, e.g. "15s", "1m".
    outputSchema:
      type: object
      required:
        - resultType
        - series
        - warnings
      additionalProperties: false
      properties:
        resultType:
          type: string
        series:
          type: array
          items:
            type: object
            required:
              - labels
              - values
            additionalProperties: false
            properties:
              labels:
                type: object
                additionalProperties:
                  type: string
              values:
                type: array
                items:
                  type: object
                  required:
                    - timestamp
                    - value
                  additionalProperties: false
                  properties:
                    timestamp:
                      type: number
                    value:
                      type: string
              histograms:
                type:
                  - array
                  - 'null'
                items:
                  type: object
                  required:
                    - timestamp
                    - histogram
                  additionalProperties: false
                  properties:
                    timestamp:
                      type: number
                    histogram: {}
        warnings:
          type: array
          items:
            type: string
    viewHint: object
    deprecated: false
