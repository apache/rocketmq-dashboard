brokerClusterName=rocketmq-studio
brokerName=rocketmq-studio-1
brokerId=0
# 与 broker-0 端口错开：listenPort=20911，fastListenPort 自动为 20909，haListenPort 自动为 20912
listenPort=20911
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
deleteWhen=04
fileReservedTime=48
# 容器网络内通过服务名访问
brokerIP1=broker-1
namesrvAddr=nameserver:9876
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true
# 消息轨迹：开启并自动创建轨迹 topic RMQ_SYS_TRACE_TOPIC
traceOn=true
traceTopicEnable=true
# Prometheus 指标导出（Studio 监控面板数据源）
# Host 必须显式设为 0.0.0.0：默认取 brokerIP1，会导致容器外抓取不到 5557
metricsExporterType=PROM
metricsPromExporterPort=5557
metricsPromExporterHost=0.0.0.0
