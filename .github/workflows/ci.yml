name: CI

# 检测前端与后端是否都能正确编译
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Backend Build (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Dragonwell)
        uses: actions/setup-java@v4
        with:
          distribution: dragonwell
          java-version: "21"
          cache: maven

      - name: Build backend
        run: mvn -B -ntp clean package -DskipTests

  backend-test:
    name: Backend Tests (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Dragonwell)
        uses: actions/setup-java@v4
        with:
          distribution: dragonwell
          java-version: "21"
          cache: maven

      - name: Run backend tests
        run: mvn -B -ntp test

  frontend-build:
    name: Frontend Build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  frontend-docker-build:
    name: Frontend Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          tags: rocketmq-studio-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rmqctl-test:
    name: rmqctl Build (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rmqctl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: rmqctl/go.mod
          cache-dependency-path: rmqctl/go.sum

      - name: Check formatting
        run: make fmt

      # catalog-verify regenerates internal/catalog/catalog_gen.go from
      # ../server/src/main/resources/tool-catalog/tools and fails on drift, so the
      # full repository (rmqctl/ + server/) must be checked out.
      - name: Verify generated tool catalog
        run: make catalog-verify

      - name: Run tests (race)
        run: make test-race

      - name: Run go vet
        run: make vet

      - name: Build rmqctl binary
        run: make build
