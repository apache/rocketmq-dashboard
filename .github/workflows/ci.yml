name: CI

# Verify the build, tests, and generated artifacts for the frontend, backend, and CLI.
on:
  push:
    branches:
      - master
      - rocketmq-studio
  pull_request:
    branches:
      - master
      - rocketmq-studio

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Backend Build (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Dragonwell)
        uses: actions/setup-java@v4
        with:
          distribution: dragonwell
          java-version: "21"
          cache: maven

      - name: Build backend
        run: mvn -B -ntp clean package -DskipTests

  backend-test:
    name: Backend Tests (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Dragonwell)
        uses: actions/setup-java@v4
        with:
          distribution: dragonwell
          java-version: "21"
          cache: maven

      - name: Run backend tests
        run: mvn -B -ntp test

  frontend-build:
    name: Frontend Build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # Keep the dependency install scripts, but forbid husky in prepare from modifying the Git hooks config.
        env:
          HUSKY: "0"
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run all frontend tests
        run: npm test

      - name: Run frontend license tests
        run: npm run license:test

      - name: Build frontend
        run: npm run build

  frontend-docker-build:
    name: Frontend Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build frontend Docker image (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./web
          push: false
          tags: rocketmq-studio-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rmqctl-test:
    name: rmqctl Build (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rmqctl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: rmqctl/go.mod
          cache-dependency-path: rmqctl/go.sum

      - name: Check formatting
        run: make fmt

      # Check whether the Go catalog is stale against the server-side YAML, so the full repository must be checked out.
      - name: Verify generated tool catalog
        run: make catalog-verify

      - name: Run tests (race)
        run: make test-race

      - name: Run go vet
        run: make vet

      - name: Build rmqctl binary
        run: make build

      - name: Build rmqctl for all supported platforms
        run: make build-all
