server {
    listen 80;
    server_name _;
    charset utf-8;

    # Compress text assets; the entry JS bundle is ~1MB uncompressed.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Brotli is only enabled when the image ships the module (e.g. nginx built with
    # ngx_brotli). The stock `nginx:alpine` image does not include it, so enabling the
    # directives below would break startup:
    #   brotli on;
    #   brotli_comp_level 6;
    #   brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # RESOLVER is injected by 15-resolver.envsh (podman network gateway only).
    # Variable proxy_pass re-resolves on every request, so a recreated
    # rocketmq-server container with a new IP is picked up without restarting
    # nginx.
    resolver ${RESOLVER} valid=10s;

    # Hashed build assets are content-addressable and never change; cache them forever
    # so repeat visits download the ~1.8MB JS bundle only once.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache the HTML shell so a released build is picked up immediately.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $backend http://rocketmq-server:8888;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep streaming configuration scoped to the two SSE endpoints only. Other API
    # responses retain the default proxy buffering and timeout behavior.
    #
    # These replaced `location = /api/ai/chat`. Without them both streams fall through to the
    # generic /api/ block below, which keeps nginx's default proxy_buffering on and its 60s
    # proxy_read_timeout — a buffered proxy is the single most common way this feature breaks in
    # production. The application also sends `X-Accel-Buffering: no`, `Cache-Control: no-cache,
    # no-transform` and a 15s heartbeat, and those are the primary defence; this block is the
    # second one, because relying on a response header alone means a proxy configured to ignore
    # it (proxy_ignore_headers) silently turns streaming into a stall.
    #
    # Regex locations are matched before the plain prefix `location /api/`, so these win for the
    # two streaming paths and nothing else. `proxy_read_timeout 360s` sits above the server's own
    # 300s CLI stream budget. The proxy_pass indirection through a variable is deliberate: it makes
    # nginx resolve the upstream at request time instead of at startup, so this container can start
    # before rocketmq-server is up.
    location ~ ^/api/ai/conversations/[0-9]+/messages$ {
        set $backend_ai_messages http://rocketmq-server:8888;
        proxy_pass $backend_ai_messages;
        proxy_buffering off;
        proxy_read_timeout 360s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/ai/runs/[0-9]+/stream$ {
        set $backend_ai_stream http://rocketmq-server:8888;
        proxy_pass $backend_ai_stream;
        proxy_buffering off;
        proxy_read_timeout 360s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Springdoc endpoints live outside /api/ and must bypass the SPA fallback.
    location = /api-docs {
        set $backend_api_docs http://rocketmq-server:8888;
        proxy_pass $backend_api_docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api-docs/ {
        set $backend_api_docs_assets http://rocketmq-server:8888;
        proxy_pass $backend_api_docs_assets;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /swagger-ui.html {
        set $backend_swagger_redirect http://rocketmq-server:8888;
        proxy_pass $backend_swagger_redirect;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /swagger-ui/ {
        set $backend_swagger_assets http://rocketmq-server:8888;
        proxy_pass $backend_swagger_assets;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /livez {
        set $backend_livez http://rocketmq-server:8888;
        proxy_pass $backend_livez;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz {
        set $backend_readyz http://rocketmq-server:8888;
        proxy_pass $backend_readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only the health endpoint is reachable through the edge. The rest of
    # /actuator/ (env, beans, mappings, metrics, ...) must never be exposed
    # without authentication.
    location ~ ^/actuator/health {
        set $backend_actuator http://rocketmq-server:8888;
        proxy_pass $backend_actuator;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/actuator/ {
        return 404;
    }
}
